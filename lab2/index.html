<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 2 - Vector laboratory</title>
  <style>
    body { margin: 0; font: 14px sans-serif; }
    canvas { display: block; }
    #panel { position: absolute; top: 10px; left: 10px; padding: 12px; background: white; }
    input { width: 52px; margin-bottom: 8px; }
    pre { margin-bottom: 0; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="panel">
    <div>A (red):
      <label>x <input id="ax" type="number" value="3" step="0.1"></label>
      <label>y <input id="ay" type="number" value="4" step="0.1"></label>
      <label>z <input id="az" type="number" value="0" step="0.1"></label>
    </div>
    <div>B (blue):
      <label>x <input id="bx" type="number" value="1" step="0.1"></label>
      <label>y <input id="by" type="number" value="0" step="0.1"></label>
      <label>z <input id="bz" type="number" value="0" step="0.1"></label>
    </div>
    <pre id="results"></pre>
    <pre id="intersection"></pre>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
